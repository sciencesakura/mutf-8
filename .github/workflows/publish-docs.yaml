name: publish docs

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/publish-docs.yaml'
      - 'package.json'
      - 'packages/**'
      - '!packages/**/*.bench.*'
      - '!packages/**/*.test.*'
      - 'README.md'
      - 'tsconfig.json'
      - 'typedoc.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-api-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: ~12
      - name: Compile
        run: pnpm -r run compile
      - name: Generate TypeDoc pages
        run: pnpm run docs
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          folder: docs
          clean: true
