name: publish
on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Install dependencies
        run: pnpm ci
      - name: Publish packages
        run: pnpm -r publish
