name: build
on:
  pull_request:
    paths:
      - '.editorconfig'
      - '.github/workflows/build.yaml'
      - 'biome.json'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/**'
      - 'tsconfig.json'
  push:
    branches:
      - master
    paths:
      - '.editorconfig'
      - '.github/workflows/build.yaml'
      - 'biome.json'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/**'
      - 'tsconfig.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts=true
      - name: Run build
        run: npm run build:ci --workspaces
